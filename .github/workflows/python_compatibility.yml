# Python Compatibility Testing Workflow
#
# Tests azdev package build and aaz-dev-tools compatibility across:
# - Operating Systems: Ubuntu, macOS, Windows
# - Python Versions: 3.11, 3.12, 3.13
#
# Validates that the package can be built and installed correctly
# and is compatible with aaz-dev-tools dependencies on all supported
# platforms and Python versions.

name: Python Compatibility Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
  pull_request:

env:
  # Change this to invalidate existing cache.
  CACHE_PREFIX: v0
  PYTHON_PATH: ./

permissions:
  contents: read

jobs:
  build:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install prerequisites
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Build wheel
        run: |
          python setup.py check
          python setup.py bdist_wheel sdist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/
          retention-days: 1

  compatibility-test:
    name: Python ${{ matrix.python }} - ${{ matrix.os }} - aaz-dev-tools compatibility
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist/

      - name: Test aaz-dev-tools compatibility - Unix/Linux/macOS
        if: runner.os != 'Windows'
        run: |
          ./scripts/tests/test_compatibility_unix.sh "${{ matrix.python }}" "${{ matrix.os }}"
        shell: bash

      - name: Test aaz-dev-tools compatibility - Windows
        if: runner.os == 'Windows'
        run: |
          .\scripts\tests\test_compatibility_windows.ps1 -PythonVersion "${{ matrix.python }}" -OSName "${{ matrix.os }}"
        shell: pwsh

      - name: Cleanup test environment - Unix/Linux/macOS
        if: always() && runner.os != 'Windows'
        run: rm -rf test_env || true
        shell: bash

      - name: Cleanup test environment - Windows
        if: always() && runner.os == 'Windows'
        run: if (Test-Path "test_env") { Remove-Item -Recurse -Force test_env }
        shell: pwsh
